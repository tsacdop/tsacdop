name: Publish Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v1.0.4
        required: true
        type: string
      build_run_id:
        description: Successful Flutter Build run for the tagged commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Test release verification
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Verify and publish signed APKs
        run: python3 .github/scripts/publish_release.py
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
